Prompt

You are a senior software architect, AI engineer, UX designer, and startup product strategist.

Design a modern AI productivity platform called Taskly.

Taskly is a nature-inspired AI task management system that helps people capture tasks quickly and complete them efficiently.

The product should combine:

AI automation

voice input

beautiful UX

calming nature design

The goal is to create a world-class productivity product capable of scaling to millions of users.

🌱 Core Philosophy

Taskly is not a to-do list.

Taskly is a productivity ecosystem.

Concept:

Users manage work like growing a garden.

Example mapping:

Seed → new task
Plant → in progress
Tree → completed task

This creates emotional engagement.

🌿 Design Philosophy

Follow biophilic design principles.

The interface should mimic nature.

Design elements:

• organic shapes
• natural colors
• smooth animations
• calm layouts

Nature-based design reduces stress and improves focus.

🎨 Color System

Primary palette:

Forest green
Leaf green
Ocean blue
Sky blue

Accent palette:

Sunrise orange
Lavender purple
Sand beige

Backgrounds:

Mist white
Soft earth tones

Nature palettes help create emotional connection with users.

🧠 Core AI Features
Voice → Task

User speaks:

“Remind me to finish the presentation tomorrow at 5.”

AI extracts:

task title
deadline
priority
subtasks

Example output:

{
 "task": "Finish presentation",
 "deadline": "Tomorrow 5pm",
 "priority": "High"
}
AI Priority Detection

AI determines urgency.

Factors:

deadline
keywords
task complexity

Priority levels:

High
Medium
Low

AI Smart Reminders

Taskly automatically schedules reminders.

Example:

“Presentation due tomorrow.”

Reminder schedule:

Morning reminder
2-hour alert
30-minute alert

AI Risk Engine

Detect missed work.

Example:

⚠️ Task risk alert
“Your meeting starts in 1 hour and preparation is incomplete.”

Daily AI Brief

Every morning:

“Good morning.

Today you have:

3 important tasks
1 urgent deadline.”

