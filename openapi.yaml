info:
  title: Shvasa API
  version: 1.0.0
  description: Handshake API contract between Frontend and Backend.
paths:
  /tasks:
    get:
      summary: Retrieve all tasks for the current user, ordered by urgency score.
      parameters:
        - in: header
          name: x-user-id
          schema:
            type: string
          required: true
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Parse voice transcript and create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw_transcript, user_id]
              properties:
                raw_transcript:
                  type: string
                  description: The raw text extracted loosely from Whisper.
                user_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Task successfully created from transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '202':
          description: Needs user confirmation due to low AI confidence.
          content:
            application/json:
              schema:
                type: object
                properties:
                  needs_confirmation:
                    type: boolean
                  partial_task:
                    $ref: '#/components/schemas/AIParseResult'
        '409':
          description: Conflict detected within 30m of deadline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflict_detected:
                    type: boolean
                  conflicting_task_id:
                    type: string
                    format: uuid
                  suggested_reschedule_time:
                    type: string
                    format: date-time
                  partial_task:
                    $ref: '#/components/schemas/AIParseResult'
  /tasks/{id}:
    get:
      summary: Get task details including subtasks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detailed task view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /parse:
    post:
      summary: Pure AI parsing function for testing transcript processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw_transcript]
              properties:
                raw_transcript:
                  type: string
      responses:
        '200':
          description: Extracted result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIParseResult'

components:
  schemas:
    Subtask:
      type: object
      required: [id, text, done, order]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        done:
          type: boolean
        order:
          type: integer
    Task:
      type: object
      required: [id, title, priority, status, urgency_score, raw_transcript, ai_confidence]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        deadline:
          type: string
          format: date-time
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE, ARCHIVED]
        urgency_score:
          type: number
          format: float
        raw_transcript:
          type: string
        ai_confidence:
          type: number
          format: float
        subtasks:
          type: array
          items:
            $ref: '#/components/schemas/Subtask'
    AIParseResult:
      type: object
      properties:
        task:
          type: object
          properties:
            title:
              type: string
            deadline:
              type: string
              format: date-time
            priority:
              type: string
              enum: [LOW, MEDIUM, HIGH]
            subtasks:
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
                  order:
                    type: integer
            notes:
              type: string
        confidence:
          type: number
          format: float
        needs_confirmation:
          type: boolean
        suggested_deadline:
          type: string
          format: date-time
